function nextSystemId() {
  let max = 0;
  DB.systems.forEach(s => { const m = /SYS-(\d+)/.exec(s.systemId||''); if (m) max = Math.max(max, parseInt(m[1],10)); });

}

function migrate(data) {
  const d = Object.assign({systems:[],changes:[],activities:[],people:[],connections:[],budgetRam:{}}, data||{});
  if (typeof d.budgetRam === "number") { const y = new Date().getFullYear(); d.budgetRam = { [y]: d.budgetRam }; }
  d.systems = (d.systems||[]).map(s => Object.assign({
    id: uid(), systemId:"", namn:"", systemagare:"", produktagare:"", forvaltare:"", verksamhet:"",
    informationsklass:"", sakerhetsskyddsklass:KLASSER[0], ackrediteringsniva:ACKREDITERINGSNIVAER[0],
    ackrediteringsstatus:STATUSAR[2], senasteAckreditering:"", giltigtBeslut:"", nastaOmprovning:"",
    kritikalitet:"Medel", livscykelfas:LIVSCYKELFASER[3], portfoljstatus:PORTFOLJSTATUS[0],
    leverantor:"", driftsmiljo:DRIFTSMILJOER[0], lank:"", not:"",
    centralAckrediteringsdatum:"", lokalAckrediteringsdatum:"",
    kontinuitetsplan:"Nej", rto:"", rpo:"", kontinuitetsansvarig:"", senasteOvning:"", nastaOvning:"",
    kravUppfyllda:0, kravEjUppfyllda:0, kravUnderAtgard:0, kravEjUppfylldaLista:[], kravUnderAtgardLista:[],
    riskKritiska:0, riskHoga:0, riskMedel:0, riskLaga:0, senasteRiskbedomning:"",
  }, s));
  d.connections = d.connections || [];
  d.changes = (d.changes||[]).map(c => Object.assign({id:uid(), systemId:"", datum:"", typ:"annat", beskrivning:"", ansvarig:"", paverkan:"Nej", planeradOmackreditering:"", planeradTimmar:0, planeradKostnad:0, status:"Öppen"}, c));

  return d;
}

  const raw = localStorage.getItem(STORAGE_KEY);

} catch(e) { DB = migrate(seed()); }

let UI = { tab: "dashboard", year: new Date().getFullYear(), showNewSystem: false, expanded: null, registerFilter: "" };

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
  catch(e) { toast("Kunde inte spara — lokal lagring otillgänglig."); }
}
function toast(msg) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.style.display = "none", 3200);
}

function relatedSystems(id) {
  const ids = new Set();
  DB.connections.forEach(cn => { if (cn.fromId===id) ids.add(cn.toId); if (cn.toId===id) ids.add(cn.fromId); });
  return [...ids].map(sysById).filter(Boolean);
}
function nextChangeForSystem(id) {
  return DB.changes.filter(c=>c.systemId===id && c.datum && c.datum>=todayISO()).sort((a,b)=>a.datum<b.datum?-1:1)[0];
}
function changeFlagForSystem(id) {
  const cs = DB.changes.filter(c=>c.systemId===id);
  if (cs.some(c=>c.paverkan==="Ja")) return "ja";
  if (cs.some(c=>c.paverkan==="Möjligen")) return "bedom";
  return "nej";
}

// ---------------- Derived / aggregat ----------------
// OBS: alla resurs- och budgetberäkningar är årsbundna (parametern "year").
// Det förhindrar att timmar/kostnader från olika år råkar summeras ihop.
function computeMonthLoad(year) {
  const load = {};
  for (const p of DB.people) load[p.namn] = Array(12).fill(0);
  for (const a of DB.activities) {
    if (a.ar !== year) continue;
    if (!load[a.ansvarig]) load[a.ansvarig] = Array(12).fill(0);
    load[a.ansvarig][a.manad-1] += Number(a.timmar) || 0;
  }
  return load;
}
function totalCost(year) { return DB.activities.filter(a=>a.ar===year).reduce((s,a) => s + (Number(a.kostnad)||0), 0); }
function getBudgetRam(year) { return (DB.budgetRam && DB.budgetRam[year]) || 0; }
function setBudgetRam(year, value) { DB.budgetRam = DB.budgetRam || {}; DB.budgetRam[year] = Number(value)||0; }
function avgCapacityUtil(monthLoad) {
  const vals = DB.people.map(p => {
    const load = monthLoad[p.namn]||Array(12).fill(0);
    const max = Math.max(...load,0);
    return p.kapacitet>0 ? (max/p.kapacitet*100) : 0;
  });
  if (!vals.length) return 0;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function aggregatePortfolio() {
  const counts = {"Grön – Drift":0, "Gul – Åtgärd":0, "Röd – Problem":0};
  DB.systems.forEach(s => { counts[s.portfoljstatus] = (counts[s.portfoljstatus]||0)+1; });
  return counts;
}
function aggregateAckreditering() {
  const giltig = DB.systems.filter(s=>s.ackrediteringsstatus==="Ackrediterad").length;
  const nasta90 = DB.systems.filter(s=>s.nastaOmprovning && daysUntil(s.nastaOmprovning)>=0 && daysUntil(s.nastaOmprovning)<=90).length;
  const forsenad = DB.systems.filter(s=>s.nastaOmprovning && daysUntil(s.nastaOmprovning)<0).length;
  const potentiell = DB.systems.filter(s => changeFlagForSystem(s.id) !== "nej").length;
  return {giltig, nasta90, forsenad, potentiell};
}
function aggregateKrav() {
  return DB.systems.reduce((acc,s)=>{ acc.ok += Number(s.kravUppfyllda)||0; acc.ej += Number(s.kravEjUppfyllda)||0; acc.atgard += Number(s.kravUnderAtgard)||0; return acc; }, {ok:0, ej:0, atgard:0});
}
function aggregateRisk() {
  return DB.systems.reduce((acc,s)=>{ acc.krit+=Number(s.riskKritiska)||0; acc.hog+=Number(s.riskHoga)||0; acc.med+=Number(s.riskMedel)||0; acc.lag+=Number(s.riskLaga)||0; return acc; }, {krit:0,hog:0,med:0,lag:0});
}
function aggregateForandringar() {
  const kommande = DB.changes.filter(c=>c.datum && c.datum>=todayISO());
  const paverkar = DB.changes.filter(c=>c.paverkan==="Möjligen");
  const kraverOm = DB.changes.filter(c=>c.paverkan==="Ja");
  return {total: kommande.length, paverkar: paverkar.length, kraverOm: kraverOm.length};
}
function buildTodoList() {
  const items = [];
  DB.systems.forEach(s => {
    if (s.nastaOmprovning) {
      const dgr = daysUntil(s.nastaOmprovning);
      if (dgr < 0) items.push({tone:'crit', text:`${s.namn} – ackreditering löpte ut ${fmt(s.nastaOmprovning)}`, sort:dgr});
      else if (dgr <= 90) items.push({tone:'warn', text:`${s.namn} – ackreditering löper ut ${fmt(s.nastaOmprovning)} (${dgr} dgr)`, sort:dgr+300});
    }
    if ((s.kravEjUppfyllda||0) > 0) items.push({tone: s.kravEjUppfyllda>=10?'crit':'warn', text:`${s.namn} – ${s.kravEjUppfyllda} ej uppfyllda krav`, sort:500});
    const riskSum = (Number(s.riskKritiska)||0) + (Number(s.riskHoga)||0);
    if (riskSum > 0) items.push({tone: s.riskKritiska>0?'crit':'warn', text:`${s.namn} – ${riskSum} höga/kritiska risker`, sort:520});
    if (s.lokalAckrediteringsdatum && !s.centralAckrediteringsdatum) items.push({tone:'warn', text:`${s.namn} – lokal ackreditering registrerad utan central ackreditering, kontrollera ordningen`, sort:400});
  });
  DB.changes.forEach(c => {
    const sname = sysById(c.systemId)?.namn || "Okänt system";
    if (c.paverkan==="Möjligen" && c.status!=="Genomförd") items.push({tone:'warn', text:`${sname} – ${c.beskrivning} → bedöm ackrediteringspåverkan`, sort:250});
    if (c.paverkan==="Ja") {
      items.push({tone:'crit', text:`${sname} – ${c.beskrivning} kräver omackreditering${c.planeradOmackreditering ? ' (planerad '+fmt(c.planeradOmackreditering)+')':''}`, sort:150});
      const rel = relatedSystems(c.systemId);
      if (rel.length) items.push({tone:'warn', text:`${sname}s förändring kan även påverka kopplade system: ${rel.map(r=>r.namn).join(', ')}`, sort:350});
    }
    if (c.paverkan==="Nej" && c.datum && daysUntil(c.datum)>=0 && daysUntil(c.datum)<=90) {
      items.push({tone:'info', text:`${sname} – planerad förändring: ${c.beskrivning} (${fmt(c.datum)})`, sort:600});
    }
  });
  const thisYear = new Date().getFullYear();
  const monthLoad = computeMonthLoad(thisYear);
  const overload = Object.entries(monthLoad).filter(([name,arr]) => { const p = DB.people.find(pp=>pp.namn===name); return p && arr.some(h=>h>p.kapacitet); });
  if (overload.length) items.push({tone:'warn', text:`Resursöverbelastning hos ${overload.map(([n])=>n).join(', ')} ${thisYear} — se Ackrediteringsårshjul`, sort:700});
  const ram = getBudgetRam(thisYear), cost = totalCost(thisYear);
  if (ram > 0 && cost > ram) items.push({tone:'crit', text:`Budgetram ${thisYear} är överskriden: planerad kostnad ${cost.toLocaleString("sv-SE")} kr mot ram ${ram.toLocaleString("sv-SE")} kr`, sort:120});
  items.sort((a,b)=>a.sort-b.sort);
  return items;
}

function renderTab(todo) {
  switch(UI.tab) {
    case "dashboard": return renderDashboard(todo);
    case "register": return renderRegister();
    case "graph": return renderGraph();
    case "changes": return renderChanges();
    case "wheel": return renderWheel();
    case "continuity": return renderContinuity();
    case "resources": return renderResources();
    case "export": return renderExport();
    default: return "";
  }
}

function sectionTitle(title, sub) {
  return `<div style="margin-bottom:20px;"><h1 class="title">${esc(title)}</h1>${sub?`<div class="subtitle">${esc(sub)}</div>`:''}</div>`;
}
function field(label, inner, wide) { return `<div${wide?' class="span3"':''}><div class="field-label">${esc(label)}</div>${inner}</div>`; }
function gaugeSVG(pct, color) {
  const r = 34, c = 2*Math.PI*r; const dash = (pct/100)*c;
  return `<svg width="82" height="82" viewBox="0 0 84 84">
    <circle cx="42" cy="42" r="${r}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="8"/>
    <circle cx="42" cy="42" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${dash} ${c}" transform="rotate(-90 42 42)"/>
  </svg>`;
}
function gaugeColor(pct, invert) {
  if (invert) { if (pct>100) return '#E08979'; if (pct>=75) return '#E0B569'; return '#7FC4A8'; }
  if (pct>=80) return '#7FC4A8'; if (pct>=50) return '#E0B569'; return '#E08979';
}
function kpiGauge(label, valueText, pct, color) {
  const clamped = Math.max(0, Math.min(100, pct));
  return `<div class="kpi-gauge"><div class="gauge-wrap">${gaugeSVG(clamped, color)}<div class="gauge-value">${esc(valueText)}</div></div><div class="kpi-label">${esc(label)}</div></div>`;
}
function kpiPlain(label, value, color) { return `<div class="kpi-gauge"><div class="kpi-plain" style="color:${color};">${esc(value)}</div><div class="kpi-label">${esc(label)}</div></div>`; }
function kritPill(k) {
  const map = {"Låg":["#DCE7E2","#294238"], "Medel":["#E4E9EC","#3D4B4F"], "Hög":["#F4E3C8","#8A5A0F"], "Kritisk":["#F3DDD8","#9C3B2E"]};
  const [bg,fg] = map[k]||["#eee","#333"];
  return `<span class="pill" style="background:${bg}; color:${fg};">${esc(k||"—")}</span>`;
}
function dot(color) { return `<span class="dot" style="color:${color};">●</span>`; }
function portfoljDotLabel(status) {
  const map = {"Grön – Drift":["#3AA876","Drift"], "Gul – Åtgärd":["#D9A227","Åtgärd"], "Röd – Problem":["#C0392B","Problem"]};
  const [color,label] = map[status] || ["#8B9A95", status||"—"];
  return dot(color) + esc(label);
}
function omackrediteringCell(id) {
  const flag = changeFlagForSystem(id);
  if (flag==="ja") return `<span class="pill" style="background:#F3DDD8; color:#9C3B2E;">Ja</span>`;
  if (flag==="bedom") return `<span class="pill" style="background:#F4E3C8; color:#8A5A0F;">Bedöm</span>`;
  return `<span style="color:#8B9A95;">Nej</span>`;
}
function statCard(title, rows) {
  return `<div class="card" style="padding:16px;">
    <h3 class="card-title">${esc(title)}</h3>
    ${rows.map(r=>`<div class="dotrow"><span>${dot(r.color)}${esc(r.label)}</span><span class="val">${r.value}</span></div>`).join('')}
  </div>`;
}

function removeSystem(id) {

// ---------------- Systemsamband (graf) ----------------
function renderGraph() {
  const nodes = DB.systems;
  const n = nodes.length;
  const cx=380, cy=250, R = n>1 ? 190 : 0;
  const pos = {};
  nodes.forEach((s,i) => { const angle = (2*Math.PI*i/Math.max(n,1)) - Math.PI/2; pos[s.id] = { x: cx + R*Math.cos(angle), y: cy + R*Math.sin(angle) }; });
  const lines = DB.connections.map(c => {
    const p1 = pos[c.fromId], p2 = pos[c.toId]; if (!p1 || !p2) return '';
    return `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${CONNECTION_COLORS[c.typ]||'#999'}" stroke-width="1.6" opacity="0.75"/>`;
  }).join('');
  const nodeColors = {"Låg":"#35564D","Medel":"#56666B","Hög":"#B4791F","Kritisk":"#9C3B2E"};
  const circles = nodes.map(s => { const p = pos[s.id]; return `<g>
      <circle cx="${p.x}" cy="${p.y}" r="26" fill="#fff" stroke="${nodeColors[s.kritikalitet]||'#999'}" stroke-width="2.4"/>
      <text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-size="9.5" font-family="IBM Plex Sans, sans-serif" fill="#16262B" font-weight="600">${esc((s.namn||'').slice(0,9))}</text>
    </g>`; }).join('');
  const options = DB.systems.map(s=>`<option value="${s.id}">${esc(s.namn)}</option>`).join('');

  return `
    ${sectionTitle("Systemsamband", "Registrera beroenden, integrationer och dataflöden mellan system — underlag för konsekvensanalys vid förändring.")}
    <div class="card" style="padding:16px; margin-bottom:18px;">
      <div class="grid3">
        ${field("Från system", `<select id="nc-from">${options}</select>`)}
        ${field("Typ av samband", `<select id="nc-typ">${CONNECTION_TYPES.map(t=>`<option>${esc(t)}</option>`).join('')}</select>`)}
        ${field("Till system", `<select id="nc-to">${options}</select>`)}
      </div>
      <button class="btn" onclick="addConnection()">Lägg till samband</button>
    </div>
    ${nodes.length===0 ? `<div class="card" style="padding:18px; color:#56666B; font-size:13px;">Lägg till system i registret för att kunna visa samband.</div>` : `
    <div class="card" style="padding:18px; margin-bottom:18px;">
      <svg width="100%" viewBox="0 0 760 500" style="max-width:760px; display:block; margin:0 auto;">${lines}${circles}</svg>
      <div class="graph-legend">${CONNECTION_TYPES.map(t=>`<div class="legend-item"><span class="legend-swatch" style="background:${CONNECTION_COLORS[t]};"></span>${esc(t)}</div>`).join('')}</div>
    </div>`}
    <div class="card" style="overflow:hidden;">
      <table>
        <thead><tr><th>Från</th><th>Typ</th><th>Till</th><th></th></tr></thead>
        <tbody>
          ${DB.connections.length===0 ? `<tr><td colspan="4" style="color:#56666B; padding:14px;">Inga samband registrerade ännu.</td></tr>` :
          DB.connections.map(c => `<tr><td>${esc(sysById(c.fromId)?.namn||"—")}</td><td><span class="pill" style="background:#EAECE8; color:#3D4B4F;">${esc(c.typ)}</span></td><td>${esc(sysById(c.toId)?.namn||"—")}</td><td><button class="btn-danger" onclick="removeConnection('${c.id}')">Ta bort</button></td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}
function addConnection() {
  const fromId = document.getElementById("nc-from").value, toId = document.getElementById("nc-to").value, typ = document.getElementById("nc-typ").value;
  if (!fromId || !toId || fromId===toId) { toast("Välj två olika system."); return; }

// ---------------- Förändring & omackreditering ----------------
// Håller Förändring & omackreditering ihop med Planering (årshjul + resurser + budget):
// - "Ja" + datum          → skapar en Omackreditering-post i årshjulet
// - "Möjligen" + datum    → skapar en Förberedelse-post (bedömningsarbete)
// - "Nej", eller inget datum satt ännu → ingen automatisk post (syns istället i "Vad måste vi göra?")
// Timmar och kostnad på förändringen förs över rakt av, så de räknas in i både
// kapacitetsbelastning och budgetutnyttjande för det år aktiviteten hamnar i.
function syncChangeActivity(change) {
  DB.activities = DB.activities.filter(a => a.sourceChangeId !== change.id);
  if ((change.paverkan === "Ja" || change.paverkan === "Möjligen") && change.planeradOmackreditering) {
    const d = new Date(change.planeradOmackreditering);
    if (!isNaN(d)) {
      DB.activities.push({
        id: uid(), sourceChangeId: change.id, systemId: change.systemId,
        typ: change.paverkan === "Ja" ? "Omackreditering" : "Förberedelse",
        manad: d.getMonth()+1, ar: d.getFullYear(),
        ansvarig: change.ansvarig || (sysById(change.systemId)?.systemagare) || "",
        timmar: Number(change.planeradTimmar)||0, kostnad: Number(change.planeradKostnad)||0,
      });
    }
  }
}

        <tbody>
          ${[...DB.changes].sort((a,b)=> a.datum<b.datum?1:-1).map(c => {

              <td style="width:65px;">${c.paverkan!=="Nej" ? `<input type="number" value="${c.planeradTimmar}" onchange="updateChangeField('${c.id}','planeradTimmar',Number(this.value))">` : '—'}</td>

    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:12px;">
      ${MANADER.map((m,i) => {
        const items = filtered.filter(a=>a.manad===i+1);
        const overloadedNow = DB.people.filter(p => (monthLoad[p.namn]||[])[i] > p.kapacitet);
        return `<div class="card month-card">
          <div class="month-label" style="display:flex; justify-content:space-between; align-items:center;">
            <span>${m}</span>
            ${overloadedNow.length ? `<span title="Överbelastning: ${overloadedNow.map(p=>esc(p.namn)).join(', ')}" style="color:#9C3B2E; font-size:11px;">${icon('alert',12)}</span>` : ''}
          </div>
          ${items.length===0 ? `<div style="font-size:12px; color:#B7C0BC;">—</div>` : items.map(a => `
            <div style="font-size:12px; margin-bottom:6px; padding-bottom:6px; border-bottom:1px solid #EAECE8;">
              <div style="font-weight:500;">${esc(a.typ)}${a.sourceChangeId?' <span style="color:#B4791F; font-weight:400;">· Auto</span>':''}</div>
              <div style="color:#56666B;">${a.systemId?esc(sysById(a.systemId)?.namn||'')+' · ':''}${esc(a.ansvarig)} · ${a.timmar} h</div>
              ${a.sourceChangeId ? '' : `<button class="btn-danger" style="padding:0; margin-top:2px;" onclick="removeActivity('${a.id}')">Ta bort</button>`}
            </div>`).join('')}
        </div>`;
      }).join('')}
    </div>
  `;
}
function statRow(label, value, color) {
  return `<div><div class="field-label">${esc(label)}</div><div class="stat-value" style="${color?`color:${color};`:''}">${esc(value)}</div></div>`;
}
function changeYear(delta) { UI.year += delta; render(); }
function addActivity() {
  const ansvarig = document.getElementById("na-ansvarig").value.trim();
  if (!ansvarig) return;
  DB.activities.push({
    id: uid(), systemId: document.getElementById("na-system").value || null,
    typ: document.getElementById("na-typ").value, manad: Number(document.getElementById("na-manad").value), ar: UI.year, ansvarig,
    timmar: Number(document.getElementById("na-timmar").value) || 0, kostnad: Number(document.getElementById("na-kostnad").value) || 0, sourceChangeId: null,
  });
  save(); render();
}
function removeActivity(id) { DB.activities = DB.activities.filter(a=>a.id!==id); save(); render(); }

// ---------------- Kontinuitet ----------------
function renderContinuity() {
  return `
    ${sectionTitle("Kontinuitet", "Kontinuitetsplanering per system — planstatus, återställningsmål (RTO/RPO), ansvarig och övningar.")}
    <div class="card" style="overflow:auto;">
      <table>
        <thead><tr><th>System</th><th>Kritikalitet</th><th>Kontinuitetsplan</th><th>RTO (h)</th><th>RPO (h)</th><th>Ansvarig</th><th>Senaste övning</th><th>Nästa övning</th><th>Status</th></tr></thead>
        <tbody>
          ${DB.systems.map(s => {
            let tone, text;
            const overdue = s.nastaOvning && daysUntil(s.nastaOvning) < 0;
            const critMissingPlan = (s.kritikalitet==="Hög"||s.kritikalitet==="Kritisk") && s.kontinuitetsplan!=="Ja";
            if (critMissingPlan) { tone="crit"; text="Saknar plan"; }
            else if (overdue) { tone="crit"; text="Övning försenad"; }
            else if (s.nastaOvning && daysUntil(s.nastaOvning)<=30) { tone="warn"; text="Övning snart"; }
            else { tone="ok"; text="OK"; }
            const toneColors = {crit:["#F3DDD8","#9C3B2E"], warn:["#F4E3C8","#8A5A0F"], ok:["#DCE7E2","#294238"]};
            const [bg,fg] = toneColors[tone];
            return `<tr>
              <td style="font-weight:600;">${esc(s.namn)}</td>
              <td>${kritPill(s.kritikalitet)}</td>
              <td><select style="width:auto;" onchange="updateSystem('${s.id}','kontinuitetsplan',this.value)">${KONTINUITETSSTATUS.map(k=>`<option ${k===s.kontinuitetsplan?'selected':''}>${esc(k)}</option>`).join('')}</select></td>
              <td style="width:70px;"><input type="number" value="${esc(s.rto)}" onchange="updateSystem('${s.id}','rto',this.value)"></td>
              <td style="width:70px;"><input type="number" value="${esc(s.rpo)}" onchange="updateSystem('${s.id}','rpo',this.value)"></td>
              <td style="width:120px;"><input value="${esc(s.kontinuitetsansvarig)}" onchange="updateSystem('${s.id}','kontinuitetsansvarig',this.value)"></td>
              <td style="width:140px;"><input type="date" value="${esc(s.senasteOvning)}" onchange="updateSystem('${s.id}','senasteOvning',this.value)"></td>
              <td style="width:140px;"><input type="date" value="${esc(s.nastaOvning)}" onchange="updateSystem('${s.id}','nastaOvning',this.value)"></td>
              <td><span class="pill" style="background:${bg}; color:${fg};">${text}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

// ---------------- Resurser & budget ----------------

  const ram = getBudgetRam(UI.year), tCost = totalCost(UI.year);
  return `
    ${sectionTitle("Resurser & budget", "Planerad kapacitet per person (h/månad) jämförd mot inplanerade aktiviteter i " + UI.year + ", samt budgetram för samma år. Samma årsval som Ackrediteringsårshjulet.")}
    <div style="display:flex; gap:8px; margin-bottom:14px;">
      <button class="btn-ghost" onclick="changeYear(-1)">← ${UI.year-1}</button>
      <button class="btn-ghost" onclick="changeYear(1)">${UI.year+1} →</button>
    </div>
    <div class="card" style="padding:16px; margin-bottom:22px; max-width:420px;">
      <div style="font-size:13px; font-weight:600; margin-bottom:10px;">Budgetram ${UI.year}</div>
      <div style="display:flex; gap:10px; align-items:center;">
        <input id="budget-ram" type="number" value="${ram}" onchange="updateBudget(this.value)"><span style="font-size:12px; color:#56666B; white-space:nowrap;">kr</span>
      </div>
      <div style="margin-top:10px; font-size:13px;">
        Planerad kostnad ${UI.year}: <strong>${tCost.toLocaleString("sv-SE")} kr</strong> · Återstår:
        <strong style="color:${ram-tCost<0?'#9C3B2E':'#294238'};">${(ram-tCost).toLocaleString("sv-SE")} kr</strong>
      </div>
      <div style="font-size:11.5px; color:#8B9A95; margin-top:8px;">Planerad kostnad hämtas från aktiviteter i Ackrediteringsårshjulet för ${UI.year}, inklusive poster som skapats automatiskt från Förändring &amp; omackreditering.</div>
    </div>
    <div style="display:flex; gap:10px; margin-bottom:14px; align-items:flex-end;">
      ${field("Namn", `<input id="np-namn">`)}
      ${field("Kapacitet h/månad", `<input id="np-kap" type="number" value="10">`)}
      <button class="btn" onclick="addPerson()">Lägg till person</button>
    </div>
    <div class="card" style="overflow:auto;">
      <table>
        <thead><tr><th>Person</th><th>Kapacitet/mån</th>${MANADER.map(m=>`<th>${m}</th>`).join('')}<th></th></tr></thead>
        <tbody>
          ${DB.people.map(p => { const load = monthLoad[p.namn] || Array(12).fill(0); return `<tr>
              <td style="font-weight:600;">${esc(p.namn)}</td>
              <td style="width:90px;"><input type="number" value="${p.kapacitet}" onchange="updatePersonCap('${p.id}',this.value)"></td>
              ${load.map(h => `<td style="color:${h>p.kapacitet?'#9C3B2E':'#16262B'}; font-weight:${h>p.kapacitet?600:400};">${h>0?h:'—'}</td>`).join('')}
              <td><button class="btn-danger" onclick="removePerson('${p.id}')">Ta bort</button></td>
            </tr>`; }).join('')}
        </tbody>
      </table>
    </div>
    <div style="font-size:12px; color:#56666B; margin-top:8px;">Röd, fetstil markerar månad där planerad belastning överstiger kapacitet.</div>
  `;
}
function updateBudget(v) { setBudgetRam(UI.year, v); save(); render(); }
function addPerson() { const namn = document.getElementById("np-namn").value.trim(); if (!namn) return;
  DB.people.push({id: uid(), namn, kapacitet: Number(document.getElementById("np-kap").value)||0}); save(); render(); }
function updatePersonCap(id, v) { const p = DB.people.find(x=>x.id===id); if (!p) return; p.kapacitet = Number(v)||0; save(); render(); }
function removePerson(id) { DB.people = DB.people.filter(p=>p.id!==id); save(); render(); }

// ---------------- Export & backup ----------------
function renderExport() {
  return `
    ${sectionTitle("Export & backup", "Rapporter för ledning och tillsyn, Excel-kompatibla exporter, samt fullständig säkerhetskopia.")}
    <div class="grid3" style="max-width:920px;">
      <div class="card" style="padding:16px;">
        <h3 class="card-title">Executive report</h3>
        <div style="font-size:12.5px; color:#56666B; margin-bottom:10px;">Formaterad översiktsrapport för ledning — öppna i webbläsare och skriv ut till PDF vid behov.</div>
        <button class="btn-ghost" onclick="exportExecutiveReport()">Ladda ner executive report (.html)</button>
      </div>
      <div class="card" style="padding:16px;">
        <h3 class="card-title">Excel</h3>
        <div style="font-size:12.5px; color:#56666B; margin-bottom:10px;">Semikolonseparerad CSV, öppnas direkt i Excel (svensk regioninställning).</div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <button class="btn-ghost" onclick="exportSystemsCSV()">Systemöversikt (.csv)</button>
          <button class="btn-ghost" onclick="exportChangesCSV()">Förändringar (.csv)</button>
        </div>
      </div>
      <div class="card" style="padding:16px;">
        <h3 class="card-title">Säkerhetskopia</h3>
        <div style="font-size:12.5px; color:#56666B; margin-bottom:10px;">Fullständig backup av allt innehåll som JSON.</div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <button class="btn-ghost" onclick="exportBackupJSON()">Exportera (.json)</button>
          <button class="btn-ghost" onclick="triggerImport()">Importera (.json)</button>
          <input type="file" id="import-file-input" accept=".json" style="display:none;" onchange="handleImportFile(this)">
        </div>
      </div>
    </div>
  `;
}
function downloadFile(filename, text, mime) {
  const blob = new Blob([text], {type:(mime||"text/plain")+";charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
function csvOf(rows, headers) {
  const e = v => `"${String(v??"").replace(/"/g,'""')}"`;
  return [headers.join(";"), ...rows.map(r => headers.map(h=>e(r[h])).join(";"))].join("\\n");
}
function exportSystemsCSV() {
  downloadFile("systemoversikt.csv", csvOf(DB.systems.map(s=>{
    const nc = nextChangeForSystem(s.id);
    const riskTotal = (Number(s.riskKritiska)||0)+(Number(s.riskHoga)||0)+(Number(s.riskMedel)||0)+(Number(s.riskLaga)||0);
    return { SystemID:s.systemId, Namn:s.namn, Ägare:s.systemagare, Status:s.portfoljstatus, Ackrediteringsstatus:s.ackrediteringsstatus,
      SenastAckrediterad:fmt(s.senasteAckreditering), NästaOmprövning:fmt(s.nastaOmprovning),
      KravOK:s.kravUppfyllda, KravEjOK:s.kravEjUppfyllda, Risker:riskTotal,
      PlaneradFörändring: nc ? nc.beskrivning : "", Omackreditering: changeFlagForSystem(s.id)==="ja"?"Ja":changeFlagForSystem(s.id)==="bedom"?"Bedöm":"Nej" };
  }), ["SystemID","Namn","Ägare","Status","Ackrediteringsstatus","SenastAckrediterad","NästaOmprövning","KravOK","KravEjOK","Risker","PlaneradFörändring","Omackreditering"]));
}
function exportChangesCSV() {
  downloadFile("forandringar.csv", csvOf(DB.changes.map(c=>({
    Datum:fmt(c.datum), System:sysById(c.systemId)?.namn, Beskrivning:c.beskrivning, Ansvarig:c.ansvarig,
    Ackrediteringspåverkan:c.paverkan, PlaneradOmackreditering:fmt(c.planeradOmackreditering), Status:c.status
  })), ["Datum","System","Beskrivning","Ansvarig","Ackrediteringspåverkan","PlaneradOmackreditering","Status"]));
}
function exportBackupJSON() { downloadFile("systemtillsyn-backup.json", JSON.stringify(DB, null, 2), "application/json"); }
function triggerImport() { document.getElementById("import-file-input").click(); }
function handleImportFile(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try { const data = JSON.parse(e.target.result); if (!data.systems) throw new Error("ogiltigt format");
      DB = migrate(data); save(); render(); toast("Säkerhetskopia importerad.");
    } catch(err) { toast("Kunde inte läsa filen — kontrollera att det är en giltig säkerhetskopia."); }
  };
  reader.readAsText(file); input.value = "";
}
function exportExecutiveReport() {
  const thisYear = new Date().getFullYear();
  const portfolio = aggregatePortfolio(); const ackred = aggregateAckreditering(); const krav = aggregateKrav(); const risk = aggregateRisk(); const forand = aggregateForandringar();
  const ram = getBudgetRam(thisYear), cost = totalCost(thisYear);
  const capacityPct = avgCapacityUtil(computeMonthLoad(thisYear));
  const todo = buildTodoList().slice(0,10);
  const rows = DB.systems.map(s => {
    const nc = nextChangeForSystem(s.id);
    const riskTotal = (Number(s.riskKritiska)||0)+(Number(s.riskHoga)||0)+(Number(s.riskMedel)||0)+(Number(s.riskLaga)||0);
    return `<tr><td>${esc(s.namn)}</td><td>${esc(s.systemagare)}</td><td>${esc(s.portfoljstatus)}</td><td>${fmt(s.senasteAckreditering)}</td><td>${fmt(s.nastaOmprovning)}</td><td>${s.kravUppfyllda}</td><td>${s.kravEjUppfyllda}</td><td>${riskTotal}</td><td>${nc?esc(nc.beskrivning):'—'}</td><td>${changeFlagForSystem(s.id)==="ja"?"Ja":changeFlagForSystem(s.id)==="bedom"?"Bedöm":"Nej"}</td></tr>`;
  }).join('');
  const html = `<!DOCTYPE html><html lang="sv"><head><meta charset="UTF-8"><title>Executive report — Systemportfölj</title>
  <style>
    body{font-family:Georgia,'Times New Roman',serif; color:#16262B; max-width:960px; margin:40px auto; padding:0 20px;}
    h1{font-size:24px; border-bottom:2px solid #16262B; padding-bottom:10px;}
    h2{font-size:16px; margin-top:32px;}
    table{border-collapse:collapse; width:100%; font-family:Arial,sans-serif; font-size:12.5px;}
    th,td{border:1px solid #ccc; padding:6px 8px; text-align:left;}
    th{background:#F1F3F0;}
    .meta{color:#56666B; font-size:12px; margin-bottom:20px;}
    .stats{display:flex; gap:24px; flex-wrap:wrap; font-family:Arial,sans-serif;}
    .stat{border:1px solid #ccc; border-radius:6px; padding:10px 16px; min-width:140px;}
    .stat .n{font-size:22px; font-weight:bold;}
    ul{font-family:Arial,sans-serif; font-size:13px;}
    @media print { body{margin:0;} }
  </style></head><body>
  <h1>Executive report — Systemportfölj</h1>
  <div class="meta">Genererad ${fmt(todayISO())} · ${DB.systems.length} system i registret</div>

  <h2>Systemportfölj</h2>
  <div class="stats">
    <div class="stat"><div class="n">${portfolio["Grön – Drift"]}</div>Drift</div>
    <div class="stat"><div class="n">${portfolio["Gul – Åtgärd"]}</div>Under åtgärd</div>
    <div class="stat"><div class="n">${portfolio["Röd – Problem"]}</div>Problem</div>
  </div>

  <h2>Ackreditering</h2>
  <div class="stats">
    <div class="stat"><div class="n">${ackred.giltig}</div>Giltig</div>
    <div class="stat"><div class="n">${ackred.nasta90}</div>Nästa 90 dagar</div>
    <div class="stat"><div class="n">${ackred.forsenad}</div>Försenad</div>
    <div class="stat"><div class="n">${ackred.potentiell}</div>Potentiell omackreditering</div>
  </div>

  <h2>Krav &amp; risk</h2>
  <div class="stats">
    <div class="stat"><div class="n">${krav.ok}</div>Krav uppfyllda</div>
    <div class="stat"><div class="n">${krav.ej}</div>Krav ej uppfyllda</div>
    <div class="stat"><div class="n">${risk.krit+risk.hog}</div>Höga/kritiska risker</div>
    <div class="stat"><div class="n">${forand.total}</div>Kommande förändringar</div>
  </div>

  <h2>Resurser &amp; budget ${thisYear}</h2>
  <div class="stats">
    <div class="stat"><div class="n">${cost.toLocaleString("sv-SE")} kr</div>Planerad kostnad</div>
    <div class="stat"><div class="n">${ram.toLocaleString("sv-SE")} kr</div>Budgetram</div>
    <div class="stat"><div class="n">${(ram-cost).toLocaleString("sv-SE")} kr</div>${ram-cost<0?'Överskrider budget':'Återstår'}</div>
    <div class="stat"><div class="n">${capacityPct}%</div>Kapacitetsbelastning (högst belastad månad)</div>
  </div>

  <h2>Vad kräver ledningens uppmärksamhet</h2>
  <ul>${todo.map(t=>`<li>${t.text}</li>`).join('') || '<li>Inget brådskande just nu.</li>'}</ul>

  <h2>Systemöversikt</h2>
  <table><thead><tr><th>System</th><th>Ägare</th><th>Status</th><th>Senast ackrediterad</th><th>Nästa ackreditering</th><th>Krav OK</th><th>Krav ej OK</th><th>Risker</th><th>Planerad förändring</th><th>Omackreditering</th></tr></thead><tbody>${rows}</tbody></table>

  <p style="font-size:11px; color:#8B9A95; margin-top:30px;">Rapporten innehåller endast icke-känslig metadata. Underlag och riskdetaljer finns i externt dokumentlager.</p>
  </body></html>`;
  downloadFile("executive-report.html", html, "text/html");
}
